ernestdefoe-scribe:
  # 🚨 `lib` — NOT `forum`. These labels are needed by the composer toolbar AND
  # by the AdminCP builder that arranges it, and Flarum ships `forum:` keys only
  # to the forum frontend. Under `forum:` the admin page rendered every chip as
  # a raw translation key.
  lib:
    buttons:
      bold: Bold
      italic: Italic
      underline: Underline
      strike: Strikethrough
      code: Inline code
      superscript: Superscript
      subscript: Subscript
      text_color: Text colour
      highlight: Highlight
      heading1: Title
      heading: Heading
      subheading: Subheading
      heading4: Minor heading
      bullet_list: Bulleted list
      ordered_list: Numbered list
      quote: Quote
      align_left: Align left
      align_center: Align center
      align_right: Align right
      align_justify: Justify
      spoiler: Spoiler
      info_box: Info box
      reply_gate: Reply to view
      code_block: Code block
      link: Link
      image: Image
      table: Table
      horizontal_rule: Divider
      undo: Undo
      redo: Redo

  forum:
    composer:
      toolbar_label: Formatting
      apply: Apply
      remove_link: Remove link
      clear_colour: Clear
      clear_highlight: Clear
      link_placeholder: Paste or type a link…
      image_placeholder: Image address…
      spoiler_title_placeholder: Spoiler title…
      info_title_placeholder: Title…

  admin:
    toolbar_label: Composer toolbar
    toolbar_help: >
      Drag a feature from the palette below into the toolbar, and drag within
      the toolbar to change the order. Keyboard: press Enter on a feature to add
      it, arrow keys to move it, Delete to remove it.
    palette_label: Available features
    toolbar_empty: Drag features here to build your toolbar.
    palette_empty: Every feature is already in the toolbar.
    reset: Reset to defaults
