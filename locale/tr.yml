  admin:
    toolbar_label: Editör araç çubuğu
    toolbar_help: >
      Aşağıdaki paletten bir özelliği araç çubuğuna sürükle; sırayı değiştirmek
      için araç çubuğu içinde sürükle. Klavye: eklemek için Enter, taşımak için
      ok tuşları, kaldırmak için Delete.
    palette_label: Kullanılabilir özellikler
    toolbar_empty: Araç çubuğunu oluşturmak için özellikleri buraya sürükle.
    palette_empty: Tüm özellikler zaten araç çubuğunda.
    reset: Varsayılanlara sıfırla

    video:
      heading: Video gömme
      help: >
        Desteklenen bir video bağlantısını ayrı bir satıra yapıştır, video
        olarak gömülsün. Okuyucular önce bir önizleme görür; oynata basana
        kadar video sitesinden hiçbir şey yüklenmez. Bir siteyi kapatırsan o
        siteye ait yeni bağlantılar bağlantı olarak kalır, mevcut gömmeler de
        gönderide oynamak yerine videonun kendi sayfasını açar.
      enabled: Videoları göm (tıklayınca yüklenir)
      providers: Siteler
      not_supported: >
        Desteklenmediği için bağlantı olarak kalanlar: fb.watch, vm.tiktok.com
        ve facebook.com/share bağlantıları (bunlar yönlendirme), Rumble, Kick
        ve X/Twitter.
